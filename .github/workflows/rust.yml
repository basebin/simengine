name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: cargo check --verbose

  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clippy
        run: cargo clippy -- -D warnings

  e2e-windows:
    name: E2E Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e tests
        run: cargo test --test e2e_tests

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --verbose
      - name: Bundle binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: zip simulation-engine.zip target/release/simulation_engine
      - name: Bundle binary (Windows)
        if: runner.os == 'Windows'
        run: 7z a simulation-engine.zip target/release/simulation_engine.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulation-engine-${{ matrix.os }}
          path: simulation-engine.zip
